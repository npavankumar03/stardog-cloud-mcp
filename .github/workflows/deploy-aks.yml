name: Build and Deploy to Azure AKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACR_NAME: testcontainerregistry1992
  IMAGE_NAME: stardog-cloud-mcp
  RESOURCE_GROUP: test
  CLUSTER_NAME: testing
  ACR_LOGIN_SERVER: testcontainerregistry1992.azurecr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Debug context
      run: |
        echo "ACR_NAME=$ACR_NAME"
        echo "RESOURCE_GROUP=$RESOURCE_GROUP"
        echo "CLUSTER_NAME=$CLUSTER_NAME"
        az account show --query name -o tsv

    - name: Login to ACR
      run: az acr login --name "$ACR_NAME"

    - name: Build and push image with Docker
      run: |
        set -euo pipefail
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME"
        docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
        docker push "$IMAGE:${{ github.sha }}"
        docker push "$IMAGE:latest"

    - name: Set AKS context
      uses: azure/aks-set-context@v4
      with:
        resource-group: ${{ env.RESOURCE_GROUP }}
        cluster-name: ${{ env.CLUSTER_NAME }}

    - name: Deploy to AKS
      uses: Azure/k8s-deploy@v5
      with:
        action: deploy
        manifests: |
          k8s/deployment.yaml
          k8s/service.yaml
          k8s/ingress.yaml
        images: |
          ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        namespace: default
